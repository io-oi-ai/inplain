name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      # 版本由 package.json 的 packageManager 字段决定 —— 这里再指定会冲突
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Rendering + serialization pipeline. Pure functions, no network, no keys.
      - name: Core smoke
        run: pnpm core:smoke

      # Builds the CLI, then speaks JSON-RPC to a real MCP server over stdio.
      - name: Build CLI
        run: pnpm build

      - name: CLI + MCP smoke
        run: pnpm cli:smoke
